name: Publish isolated knowledge image
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate pipeline recovery, CRM context and canonical criteria
        run: python -m unittest discover -s tests/unit -p 'test_pipeline_*.py' -v
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: Dockerfile.knowledge
          push: true
          build-args: |
            GIT_SHA=${{ github.event.pull_request.head.sha }}
          tags: ghcr.io/murilloimparavel/crcn-knowledge-processor:sha-${{ github.event.pull_request.head.sha }}
      - name: Verify published source manifest and revision
        env:
          IMAGE: ghcr.io/murilloimparavel/crcn-knowledge-processor@${{ steps.image.outputs.digest }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker pull "$IMAGE"
          docker run --rm --entrypoint sh -e EXPECTED_SHA "$IMAGE" -c \
            'cd /app && test "$(cat .git_sha)" = "$EXPECTED_SHA" && sha256sum -c knowledge-source.sha256'
